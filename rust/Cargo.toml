[package]
name = "wb-session-branch"
version = "1.0.0"
edition = "2021"
description = "WorkBuddy 会话分支管理器"
authors = ["liuyuanlin"]
rust-version = "1.77.2"

[[bin]]
name = "wb-session-branch"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
