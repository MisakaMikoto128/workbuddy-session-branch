name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pythonnet pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller scripts\build.spec --distpath dist --workpath build

      - name: Normalize artifact name
        shell: pwsh
        run: Rename-Item -Path "dist\会话分支管理器.exe" -NewName "wb-session-branch.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wb-session-branch-windows
          path: dist\wb-session-branch.exe
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\wb-session-branch.exe>会话分支管理器.exe
          generate_release_notes: true
