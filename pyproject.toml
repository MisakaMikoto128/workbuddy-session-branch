[project]
name = "workbuddy-session-branch"
version = "1.0.0"
description = "从任意消息分叉 WorkBuddy 本地会话的桌面工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "liuyuanlin" }]
dependencies = [
  "pywebview>=5.0",
  "pythonnet>=3.0; platform_system=='Windows'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
test = ["playwright>=1.40"]

[project.scripts]
wb-branch = "app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["wb_branch", "app", "serve"]
package-dir = { "" = "src" }
